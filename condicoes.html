<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Estrutura de condições</title>
        <script>
            const n1 = Number(prompt('digite a nota 1: '))
            const n2 = Number(prompt('digite a nota 2: '))
            const n3 = Number(prompt('digite a nota 3: '))
            const n4 = Number(prompt('digite a nota 4: '))

            const media = (n1 + n2 + n3 + n4) / 4

            console.log('A média do aluno é: ' + media)
            if (media >= 7) {
                console.log('O aluno está aprovado!')
            } else if (media < 5) {
                console.log('O aluno está reprovado!')
            } else {
                console.log('O aluno está de recuperação!')
            }
            
            let contador = 1
            const qtd = prompt('Quantas notas? ')
            let soma = 0
            let nota = 0
            while(contador <= qtd) {
                do{
                    nota = Number(prompt('Digite a nota ' + contador + ': '))
                } while(nota>10)
            }
            soma = soma + nota
            contador ++
        </script>
    </head>
    <body>
    </body>
</html>
